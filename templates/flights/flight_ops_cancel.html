{% extends "base.html" %}
{% block title %}Cancel Flight{% endblock %}
{% block content %}
<div class="border rounded p-4">
  <h1 class="h5 text-danger">Cancel flight {{ flight.flight_number }}</h1>
  {% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}
  <form method="post" onsubmit="return confirm('Cancel this flight? Passengers will be notified.');">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Note (optional)</label>
      {{ form.note }}
      {{ form.note.errors }}
    </div>
    <button class="btn btn-danger" type="submit">Cancel flight</button>
    <a class="btn btn-outline-secondary" href="{% url 'flights:flight_detail' flight.id %}">Back</a>
  </form>
</div>
{% endblock %}
